spring:
  application:
    name: PayShield
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payshield}
    username: ${DATABASE_USERNAME:payshield}
    password: ${DATABASE_PASSWORD:payshield123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
  key-secret: ${RAZORPAY_KEY_SECRET:placeholder_secret}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}

app:
  jwt:
    secret: ${JWT_SECRET:payshield_jwt_secret_key_minimum_256_bits_long_for_hs256_algorithm_paypal}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  risk:
    thresholds:
      approved-max: 29
      review-max: 59
    amount:
      elevated-threshold: 500000
      high-threshold: 2000000
    velocity:
      max-transactions-per-minute: 3
      max-transactions-per-five-minutes: 5
    weights:
      amount-anomaly: 25
      velocity: 30
      repeated-failures: 20
      geographic-anomaly: 25

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.payshield: DEBUG
    org.springframework.security: INFO

