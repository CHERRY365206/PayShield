spring:
  application:
    name: PayShield-Dev
  datasource:
    url: jdbc:h2:file:./data/payshield_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

server:
  port: 8080

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
  key-secret: ${RAZORPAY_KEY_SECRET:placeholder_secret}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}

app:
  jwt:
    secret: ${JWT_SECRET:payshield_jwt_secret_key_minimum_256_bits_long_for_hs256_algorithm_paypal}
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173
  risk:
    thresholds:
      approved-max: 29
      review-max: 59
    amount:
      elevated-threshold: 500000
      high-threshold: 2000000
    velocity:
      max-transactions-per-minute: 3
      max-transactions-per-five-minutes: 5
    weights:
      amount-anomaly: 25
      velocity: 30
      repeated-failures: 20
      geographic-anomaly: 25

management:
  endpoints:
    web:
      exposure:
        include: health,info

