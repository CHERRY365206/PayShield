version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: payshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: payshield
      POSTGRES_USER: ${DATABASE_USERNAME:-payshield}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-payshield123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-payshield} -d payshield"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payshield-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/payshield
      DATABASE_USERNAME: ${DATABASE_USERNAME:-payshield}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-payshield123}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-placeholder_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-placeholder_webhook_secret}
      JWT_SECRET: ${JWT_SECRET:-payshield_jwt_secret_key_minimum_256_bits_long_for_hs256_algorithm_paypal}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:

